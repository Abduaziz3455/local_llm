# =============================================================================
#  llama-swap configuration — adds IDLE MODE to the stack.
# -----------------------------------------------------------------------------
#  llama-swap is an OpenAI-compatible proxy that starts llama-server on the
#  first request and STOPS it after `ttl` seconds of inactivity — freeing all
#  GPU VRAM (and the CPU RAM holding the MoE experts) while the model is idle.
#  The next request transparently reloads it (one cold-start delay).
#
#  Status / manual control UI:  http://localhost:8080/   (or LLAMA_PORT)
# =============================================================================

# How long to wait for llama-server to become ready after a (re)start.
# Loading the ~23 GB MoE model from disk can take a while — keep this generous.
healthCheckTimeout: 600
logLevel: info

models:
  # Model id exposed to Open WebUI / the API. Kept as "local-llm" to match the
  # old llama-server --alias, so nothing downstream needs to change.
  #
  # Pick a model by sending its id as the "model" field in the API request
  # (Open WebUI's model selector). llama-swap loads it lazily and unloads the
  # previous one — only ONE model is resident at a time (12 GB GPU can't hold
  # both), and each pays a one-time cold-start on first use after idle.
  "local-llm":
    # start-llama.sh discovers the GGUF and execs llama-server on ${PORT},
    # the port llama-swap assigns for this upstream. 2nd arg = profile name.
    cmd: sh /llama-swap/start-llama.sh ${PORT} qwen
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health

    # ---- IDLE MODE -----------------------------------------------------------
    # Unload the model after this many seconds with no requests, releasing the
    # GPU. Raise it if cold-starts annoy you; lower it to free the GPU sooner.
    #   300  = 5 minutes      900 = 15 minutes      0 would disable idle-unload
    ttl: 300

  # Gemma-4-12b (dense) with MTP — Multi-Token Prediction draft acceleration.
  # The "gemma" profile in start-llama.sh hard-codes the gemma-4-12b repo and
  # passes --model-draft <MTP drafter> --spec-type draft-mtp for ~1.4-2.2x
  # faster, lossless generation. Select it in Open WebUI by the id below.
  "gemma-4-12b":
    cmd: sh /llama-swap/start-llama.sh ${PORT} gemma
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300

  # Qwen3.5-2B (dense, tiny) — dedicated tool-calling model. The "qwen2b"
  # profile in start-llama.sh loads the Q8_0 quant from the HF cache. Used to
  # test the "small model does tool calls, Gemma answers general questions"
  # split. Loads fast; llama-swap unloads the other model on swap.
  "qwen3.5-2b":
    cmd: sh /llama-swap/start-llama.sh ${PORT} qwen2b
    proxy: "http://127.0.0.1:${PORT}"
    checkEndpoint: /health
    ttl: 300
