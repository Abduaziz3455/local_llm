# =============================================================================
#  Qwen3.6-35B-A3B (GGUF) + Open WebUI  —  single-file local stack
# -----------------------------------------------------------------------------
#  Start:      docker compose up -d
#  Dashboard:  http://localhost:3000    (or WEBUI_PORT set in .env)
#  Raw API:    http://localhost:8080/v1 (or LLAMA_PORT set in .env) — OpenAI-compatible
#  Stop:       docker compose down
#
#  All settings (ports, model, cache path) live in the .env file next to this
#  compose file. docker compose reads it automatically.
#
#  Defaults to an NVIDIA GPU. CPU-only? Make the 2 changes marked  [CPU]  below.
#
#  SWITCH MODELS (any GGUF you've downloaded into the HF cache):
#    Just point MODEL_REPO at the new folder name, e.g.:
#       MODEL_REPO=models--unsloth--Qwen3.6-27B-GGUF docker compose up -d
#    ...or edit the default in the 'llama' command below. If a repo holds
#    several quants, also set QUANT (e.g. QUANT=UD-Q4_K_XL) to pick one.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  #  llama-swap — OpenAI-compatible proxy that runs llama-server on demand and
  #  UNLOADS it after an idle timeout (see llama-swap/config.yaml -> ttl),
  #  freeing GPU VRAM + CPU RAM while idle. First request after idle pays a
  #  one-time cold-start (model reload). Status UI: http://localhost:8080/
  #
  #  The actual llama-server command lives in llama-swap/start-llama.sh — edit
  #  model flags / sampling there. Model discovery still reads .env (MODEL_REPO,
  #  QUANT, N_CPU_MOE, HF_MODEL) via the environment block below.
  # ---------------------------------------------------------------------------
  llama:
    # Unified llama-swap image — bundles both llama-swap and llama-server.
    # [CPU] -> ghcr.io/mostlygeek/llama-swap:unified-vulkan  (and delete 'deploy:' below)
    image: ghcr.io/mostlygeek/llama-swap:unified-cuda
    container_name: llama
    restart: unless-stopped
    # Cap log size so it can't fill the disk during long-running 24/7 use.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    # Run llama-swap against our mounted config (default config path differs).
    command: ["-config", "/llama-swap/config.yaml", "-listen", "0.0.0.0:8080"]
    ports:
      - "${LLAMA_PORT:-8080}:8080"     # host port from .env; container port stays 8080
    environment:
      # Token for gated/private HuggingFace repos when using the -hf fallback.
      - HF_TOKEN=${HF_TOKEN:-}
      # Where llama.cpp stores models pulled via -hf (the llama-cache volume).
      - LLAMA_CACHE=/llama-cache
      # Read by start-llama.sh to locate / download the model at (re)load time.
      - MODEL_REPO=${MODEL_REPO:-models--unsloth--Qwen3.6-35B-A3B-GGUF}
      - QUANT=${QUANT:-}
      - N_CPU_MOE=${N_CPU_MOE:-99}
      - HF_MODEL=${HF_MODEL:-}
    volumes:
      # llama-swap config + the start-llama.sh launcher script.
      - ./llama-swap:/llama-swap:ro
      # Mount the WHOLE HuggingFace hub cache read-only, so any model you
      # download later is visible. Override the location with HF_HUB if needed.
      - ${HF_HUB:-/home/abduaziz/.cache/huggingface/hub}:/hub:ro
      # Writable cache for models downloaded from HuggingFace via -hf.
      - llama-cache:/llama-cache
    deploy:                          # [CPU] delete this entire 'deploy:' block
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:cuda   # [CPU] -> ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      llama:
        condition: service_started   # llama-swap proxy is up; model loads lazily on first request
    ports:
      - "${WEBUI_PORT:-3000}:8080"     # host port from .env; container port stays 8080
    environment:
      # --- Auto-connect to the local model (no clicking through settings) ---
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://llama:8080/v1   # internal link; uses container port 8080, NOT LLAMA_PORT
      - OPENAI_API_KEY=local
      - ENABLE_OLLAMA_API=false      # we don't use Ollama; stops failed probes
      # --- Convenience ---
      - WEBUI_AUTH=false             # single-user, no login screen. Remove for multi-user.
      - ENABLE_API_KEY=true          # let the Telegram bot authenticate with a bearer key
      - DEFAULT_LOCALE=en            # default UI language (per-user override in Settings > General)
      - ENABLE_WEB_SEARCH=true       # DuckDuckGo needs no API key
      - WEB_SEARCH_ENGINE=duckduckgo
    volumes:
      - openwebui-data:/app/backend/data   # chats, knowledge bases, settings persist here
    deploy:                          # [CPU] delete this entire 'deploy:' block
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  #  Telegram assistant bot — long-polling, no exposed ports. Talks to Open WebUI
  #  over the internal Docker network. Settings come from .env (see bot vars).
  # ---------------------------------------------------------------------------
  bot:
    build:
      context: .                     # repo root: Dockerfile copies requirements.txt + bot/
      dockerfile: bot/Dockerfile
    container_name: telegram-bot
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    depends_on:
      open-webui:
        condition: service_healthy
    env_file:
      - .env                         # TELEGRAM_BOT_TOKEN, ADMIN_USER_IDS, OPENWEBUI_API_KEY, …
    volumes:
      - bot-data:/data               # SQLite chat history & per-chat settings

volumes:
  openwebui-data:
  bot-data:
  llama-cache:        # GGUF models downloaded from HuggingFace via -hf